name: Release

# Tag-triggered production release of the Maldita Castilla MiSTer core.
# Design: docs/superpowers/specs/2026-07-31-release-consolidation-design.md
#
#   push v* tag        -> resolve the gated, device-validated RBF, build the
#                         engine from the submodule pin, assemble the SD-card
#                         bundle, publish a GitHub Release.
#   workflow_dispatch  -> dry run: same resolve + build + assembly, uploads the
#                         bundle as a CI artifact, does NOT publish a release.
#
# The RBF is NOT rebuilt here. Quartus fitting is seed-sensitive, so a fresh
# build is a bitstream nobody validated on device. This resolves the artifact
# from the build-rbf.yml run whose fpga/ tree matches the tag -- the same rule
# deploy.py --fetch-rbf uses, shared via scripts/lib/resolve_rbf.py.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Redundant workflow_dispatch dry runs are fine to collapse, but a tag push
  # runs the actual `gh release create` publish step -- cancelling it
  # mid-upload leaves a partially-published GitHub Release. So: cancel
  # in-progress runs for everything EXCEPT a v* tag push, which is never
  # cancelled once started.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  resolve-rbf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      run_id: ${{ steps.resolve.outputs.run_id }}
      fpga_tree: ${{ steps.resolve.outputs.fpga_tree }}
      built_sha: ${{ steps.resolve.outputs.built_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # resolve_rbf walks history to compare fpga/ trees across runs, so a
          # shallow clone would make every comparison fail.
          fetch-depth: 0

      - name: Resolve the gated RBF build for this ref
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT=$(python3 scripts/lib/resolve_rbf.py --repo . --rev "${GITHUB_SHA}" --json)
          echo "$OUT"
          echo "run_id=$(echo "$OUT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["run_id"])')" >> "$GITHUB_OUTPUT"
          echo "built_sha=$(echo "$OUT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["built_sha"])')" >> "$GITHUB_OUTPUT"
          echo "fpga_tree=$(echo "$OUT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["fpga_tree"])')" >> "$GITHUB_OUTPUT"

      - name: Download the RBF from that run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "${{ steps.resolve.outputs.run_id }}" -n maldita-rbf -D dist/rbf
          ls -lh dist/rbf/MalditaCastilla_*.rbf

      - name: Upload the resolved RBF
        uses: actions/upload-artifact@v4
        with:
          name: resolved-rbf
          path: dist/rbf/MalditaCastilla_*.rbf
          if-no-files-found: error

  build-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Build the ARM engine in a container
        run: |
          # build_mister_arm.sh expects the gmloader-next checkout at /src. It
          # runs no git commands, so mounting only the submodule dir is safe.
          # The script asserts MISTER_BUILD linkage before stripping.
          #
          # arm32v7/debian:bullseye-slim is correct HERE: this runner is x86,
          # so the image runs under QEMU emulation regardless of base arch,
          # and this recipe needs a native (non-cross) armhf toolchain inside
          # it. The Makefile's local build path is the opposite case --
          # Apple-Silicon host, host-native arm64 image cross-compiling to
          # armhf, explicitly NOT this arm32v7 image (see the note beside
          # `build-image` there) -- both are correct in their own context.
          docker run --rm --platform linux/arm/v7 \
            -v "$PWD/external/gmloader-next:/src" -w /src \
            arm32v7/debian:bullseye-slim \
            bash .github/scripts/build_mister_arm.sh

      - name: Engine sanity (32-bit ARM ELF)
        run: |
          file external/gmloader-next/games/gmloader/gmloader | tee /dev/stderr \
            | grep "ELF 32-bit" | grep -q "ARM"

      - name: Upload engine
        uses: actions/upload-artifact@v4
        with:
          name: gmloader-engine
          path: external/gmloader-next/games/gmloader/gmloader
          if-no-files-found: error

  build-wrapper:
    # MiSTer_Maldita — MiSTer.ini's `main=` target, the only thing that can make
    # the Cores browser start the engine (that browser lists .rbf/.mra/.mgl
    # only, and MAIN is the sole per-core exec hook). Releases up to v0.2.1 did
    # not build it, so a bundle install could only be started from the Scripts
    # menu; selecting the core looked like a broken build.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # No submodules: the wrapper is vendor/Main_MiSTer overlay files plus the
      # pinned upstream tree, which build-hps.sh clones itself.
      - uses: actions/checkout@v4

      - name: Build MiSTer_Maldita
        run: |
          # Docker path: ubuntu-latest has no arm-none-linux-gnueabihf on PATH,
          # so build-hps.sh selects its Dockerfile.wrapper image (Debian
          # bullseye + Debian's armhf cross-toolchain) and builds native amd64
          # — no QEMU. The script fetches Main_MiSTer at its pinned commit and
          # fails the build if our overlay has drifted from upstream by
          # anything other than added lines.
          bash tools/mister-wrapper/build-hps.sh

      - name: Wrapper sanity (32-bit ARM ELF with the hook in it)
        run: |
          set -euo pipefail
          W=build/mister-wrapper-hps/MiSTer_Maldita
          file "$W" | tee /dev/stderr | grep "ELF 32-bit" | grep -q "ARM"
          # Same gate assemble_bundle.sh applies, run here so a stock-upstream
          # build fails in the job that produced it.
          grep -qxF "/media/fat/games/Maldita Castilla/launch.sh" <(strings "$W")

      - name: Upload wrapper
        uses: actions/upload-artifact@v4
        with:
          name: mister-wrapper
          path: build/mister-wrapper-hps/MiSTer_Maldita
          if-no-files-found: error

  assemble-release:
    needs: [resolve-rbf, build-engine, build-wrapper]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/download-artifact@v4
        with:
          name: resolved-rbf
          path: dist/rbf

      - uses: actions/download-artifact@v4
        with:
          name: gmloader-engine
          path: dist/engine

      - uses: actions/download-artifact@v4
        with:
          name: mister-wrapper
          path: dist/wrapper

      - name: Assemble the bundle
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="dryrun-${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          RBF_COUNT=$(ls dist/rbf/MalditaCastilla_*.rbf | wc -l)
          if [ "$RBF_COUNT" -ne 1 ]; then
            echo "::error::expected exactly one RBF match for dist/rbf/MalditaCastilla_*.rbf, found $RBF_COUNT" >&2
            ls -la dist/rbf/ >&2 || true
            exit 1
          fi
          RBF=$(ls dist/rbf/MalditaCastilla_*.rbf)
          bash scripts/release/assemble_bundle.sh "$RBF" \
            dist/engine/gmloader dist/wrapper/MiSTer_Maldita dist/out "$VERSION"

      - name: Write provenance notes
        run: |
          {
            echo "## Provenance"
            echo '```'
            echo "maldita.castilla-mister: ${GITHUB_SHA}"
            echo "gmloader-next:           $(git -C external/gmloader-next rev-parse HEAD)"
            echo "Main_MiSTer (main= wrapper): $(sed -n 's/.*MISTER_WRAPPER_HPS_UPSTREAM_COMMIT:-\([0-9a-f]*\)}.*/\1/p' tools/mister-wrapper/build-hps.sh)"
            echo "fpga/ tree hash:         ${{ needs.resolve-rbf.outputs.fpga_tree }}"
            echo "RBF from build-rbf.yml:  run ${{ needs.resolve-rbf.outputs.run_id }} (commit ${{ needs.resolve-rbf.outputs.built_sha }})"
            echo '```'
            echo ""
            echo "The RBF was not rebuilt for this release. It is the artifact from the"
            echo "gated build-rbf.yml run above, matched by fpga/ tree hash."
            echo ""
            echo "## Game data and attribution"
            echo ""
            echo "This bundle includes the game itself, so it runs as extracted."
            echo ""
            echo "*Maldita Castilla* (c) 2012 **Locomalito** — music by **Gryzor87**,"
            echo "cover art by **Marek Barej** — is licensed under [Creative Commons"
            echo "Attribution-NonCommercial-NoDerivatives 4.0 International"
            echo "(CC BY-NC-ND 4.0)](https://creativecommons.org/licenses/by-nc-nd/4.0/)."
            echo "The game files are redistributed **unmodified**, and the licence text"
            echo "ships with them as \`games/gmloader/LICENSE.malditacastilla.txt\`."
            echo "Origin and checksums: \`release/gamedata/SOURCE.txt\` in this repo."
            echo "Nothing in this release is sold; redistributing it onward must stay"
            echo "non-commercial."
            echo ""
            echo "\`mygame.apk\` also contains YoYo Games' GameMaker Android runner"
            echo "(\`libyoyo.so\`), which the CC licence does not cover; it is included on the"
            echo "same footing as the public PortMaster port it comes from."
          } > dist/notes.md
          cat dist/notes.md

      - name: Publish the GitHub Release (tag only)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/out/MalditaCastilla-MiSTer-${VERSION}.zip" \
            dist/rbf/MalditaCastilla_*.rbf \
            dist/out/sha256sums.txt \
            --title "Maldita Castilla MiSTer ${GITHUB_REF_NAME}" \
            --notes-file dist/notes.md

      - name: Upload the dry-run bundle (dispatch only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle-${{ env.VERSION }}
          path: |
            dist/out/MalditaCastilla-MiSTer-*.zip
            dist/out/sha256sums.txt
          if-no-files-found: error
